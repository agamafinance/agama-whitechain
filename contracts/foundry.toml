[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.28"
# Whitechain Sepolia runs Isthmus (Prague). Ethereum Sepolia is past Pectra too, so one target fits both legs.
evm_version = "prague"
optimizer = true
optimizer_runs = 10_000
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64

[rpc_endpoints]
whitechain_sepolia = "https://rpc.testnet.whitechain.io"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
whitechain_sepolia = { key = "blockscout", url = "https://explorer.testnet.whitechain.io/api/", chain = 1874 }

[fmt]
line_length = 120
